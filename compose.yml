name: portafolio
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  init:
    image: ${DOCKER_USERNAME:-klausjung011}/portafolio-api:${IMAGE_TAG:-local}
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [tools]
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    command: [sh, -c, 'alembic upgrade head && python -m app.init_db']
    logging: *logging
  api:
    image: ${DOCKER_USERNAME:-klausjung011}/portafolio-api:${IMAGE_TAG:-local}
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  web:
    image: ${DOCKER_USERNAME:-klausjung011}/portafolio-web:${IMAGE_TAG:-local}
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
volumes:
  postgres_data:
