name: Pruebas del portafolio
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/portfolio_test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias Python
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Unitarias e integracion contra PostgreSQL descartable
        working-directory: backend
        run: python -m pytest -v --junitxml=../test-results/backend.xml
      - name: Verificar migracion inicial en PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/portfolio_test
          ADMIN_PASSWORD: TestPasswordForCI12345678
        run: |
          alembic upgrade head
          python -m app.init_db
          alembic check
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Pruebas unitarias de interfaz
        working-directory: frontend
        run: npm test
      - name: Compilar frontend y verificar TypeScript
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-backend
          path: test-results/

  e2e:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: TestDatabasePassword12345678
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TestPasswordForCI12345678
      COOKIE_SECURE: 'false'
      IMAGE_TAG: ci
      COMPOSE_FILE: compose.yml:compose.local.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar imagenes de prueba
        run: docker compose --profile tools build
      - name: Aplicar migraciones y datos iniciales
        run: docker compose run --rm init
      - name: Iniciar aplicacion completa
        run: docker compose up -d --wait --wait-timeout 180
      - name: Validar configuracion de Nginx de produccion
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout "$RUNNER_TEMP/tls/server.key" -out "$RUNNER_TEMP/tls/server.crt" -subj '/CN=localhost'
          docker compose run --rm --no-deps --volume "$PWD/infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro" --volume "$RUNNER_TEMP/tls:/etc/nginx/tls:ro" web nginx -t
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ejecutar las tres pruebas E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Logs si fallan las pruebas
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - name: Limpiar contenedores y datos descartables
        if: always()
        run: docker compose down -v

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.0'
      - name: Formato y validacion Terraform sin credenciales
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis Ansible
        working-directory: infra/ansible
        run: |
          python -m pip install 'ansible-core>=2.18,<2.19'
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i 'portfolio,' playbook.yml --syntax-check
